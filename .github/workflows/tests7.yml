name: Tests VII

on:
  pull_request:
    paths:
      - '**.py'
      - '!setup.py'
      - '.github/workflows/tests7.yml'

jobs:
  django-tests:
    runs-on: ubuntu-latest
    name: Django Test Suite
    steps:
      - name: Checkout django-snowflake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout Django
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'Snowflake-Labs/django'
          ref: 'snowflake-6.2.x'
          path: 'django_repo'
      - name: Install system packages for Django's Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libmemcached-dev
      - name: Install Django and its Python test dependencies
        run: |
          pip3 install -U pip
          cd django_repo/tests/
          pip3 install -e ..
          pip3 install -r requirements/py3.txt
      - name: install the django-snowflake backend
        run: pip3 install .
      - name: Copy the test settings file
        run: cp .github/workflows/snowflake_settings.py django_repo/tests/
      - name: Run the tests
        run: >
          python3 django_repo/tests/runtests.py --settings snowflake_settings -v 2
          many_to_many
          many_to_one
          many_to_one_null
          max_lengths
          migrate_signals
          migrations
          migration_test_data_persistence
          modeladmin
          model_inheritance
          model_inheritance_regress
          model_meta
          model_options
          model_package
          model_regress
          model_fields
          model_forms
          model_formsets
          model_formsets_regress
          multiple_database
          mutually_referential
          nested_foreign_keys
          null_fk
          null_fk_ordering
          null_queries
          one_to_one
          ordering
          order_with_respect_to
          or_lookups
          pagination
          prefetch_related
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
